services:
  # ── FastAPI Backend & Static UI ──────────────────────────────────────────────
  - type: web
    name: devscope
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste the value in the Render dashboard
      - key: GITHUB_TOKEN
        sync: false
      - key: PORT
        value: 10000
